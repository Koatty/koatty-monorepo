name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  # changesets/action opens the "version packages" PR whenever pending
  # changesets exist (e.g. the phase G entry), which needs PR write.
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # NPM_TOKEN lives in the GitHub environment of the same name
    environment: NPM_TOKEN
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        # version comes from package.json `packageManager` (pnpm@9.15.4);
        # declaring it here too makes pnpm/action-setup fail with
        # ERR_PNPM_BAD_PM_VERSION
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity for release commits
        # The runner has no identity; commit-submodule-changes.js must be able
        # to create commits when a publish leaves tracked changes behind.
        run: |
          git config --global user.name "koatty-release-bot"
          git config --global user.email "release@koatty.dev"

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production

  sync-koatty:
    name: Sync koatty to standalone repo
    needs: release
    runs-on: ubuntu-latest
    # SYNC_TOKEN lives in the GitHub environment of the same name
    environment: SYNC_TOKEN
    # Only run when packages were actually published and koatty is among them
    if: |
      needs.release.outputs.published == 'true' &&
      contains(needs.release.outputs.publishedPackages, '"koatty"')
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync packages/koatty → Koatty/koatty#monorepo
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: bash scripts/sync-koatty-to-standalone.sh
