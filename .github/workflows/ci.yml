name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        # version comes from package.json `packageManager` (pnpm@9.15.4);
        # declaring it here too makes pnpm/action-setup fail with
        # ERR_PNPM_BAD_PM_VERSION
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        # version comes from package.json `packageManager` (pnpm@9.15.4);
        # declaring it here too makes pnpm/action-setup fail with
        # ERR_PNPM_BAD_PM_VERSION
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Phase A / QA-02: fail fast when a submodule is not checked out or has
      # no test script — turbo would silently report "no tasks" and pass
      - name: Assert submodules are testable
        run: node scripts/doctor.js --assert-submodules

      - name: Run tests
        # --force disables turbo cache on the main branch so tests really run
        # --concurrency=2 bounds package-level parallelism: several suites
        # (koatty-core unhandledRejection, koatty-typeorm/koatty-trace timing
        # assertions) fail only when the machine is oversubscribed by
        # max-concurrency jest workers. Raise it again once the remaining
        # timing assertions have moved to the §12.3 benchmarks.
        run: pnpm turbo run test --force --concurrency=2 -- --runInBand --coverage --coverageReporters=json

      - name: Phase F reference app type and compiled HTTP gates
        run: |
          pnpm --filter @koatty/example-mcp-order-service test:tsc
          pnpm test:phase-f:compiled

      - name: Changed executable source coverage (at least 80 percent)
        env:
          KOATTY_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: node scripts/check-diff-coverage.cjs > diff-coverage.json

      - name: Negative submodule failure propagation
        run: node scripts/regression/phase-a-negative-test.cjs

      - name: Production inventory and real WebSocket dispatch
        run: |
          node scripts/regression/phase-d-manifest.cjs
          node scripts/regression/phase-d-serve-size.cjs
          node scripts/regression/phase-d-ws.cjs

      - name: Real process SIGTERM drain (20x)
        run: |
          for i in $(seq 1 20); do
            node scripts/regression/phase-c-shutdown.cjs || exit 1
          done

      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-coverage
          path: |
            diff-coverage.json
            packages/*/coverage/coverage-final.json

      # Phase C acceptance gate (plan §6): the graceful-shutdown integration test
      # is timing sensitive, so run it 20 times in a row and fail on the first
      # flake. `pnpm turbo run test` above already built the workspace deps.
      - name: Graceful shutdown loop (COR-03, 20x)
        working-directory: packages/koatty-serve
        shell: bash
        run: |
          for i in $(seq 1 20); do
            echo "COR-03 graceful shutdown run $i/20"
            pnpm exec jest test/regression/COR-03.graceful-shutdown.test.ts --silent || exit 1
          done

      - name: Phase C real protocol and decorator gates
        run: |
          pnpm test:phase-c:integration
          node scripts/regression/phase-ad-decorators.cjs

      - name: Phase C real Redis isolation and lease gates
        env:
          KOATTY_TEST_REDIS_PORT: '6379'
        run: node scripts/regression/phase-c-redis.cjs

      - name: Security baseline checks (plan §12.2)
        run: pnpm security:baseline

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        # version comes from package.json `packageManager` (pnpm@9.15.4);
        # declaring it here too makes pnpm/action-setup fail with
        # ERR_PNPM_BAD_PM_VERSION
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Isolated tarball generated project acceptance
        run: pnpm exec node scripts/regression/phase-ad-package-consumer.cjs
